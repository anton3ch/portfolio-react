<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon (for browser tabs) -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png"
    />

    <!-- Viewport and Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Description and Social Meta Tags -->
    <meta name="author" content="Antony Porter" />
    <meta
      name="description"
      content="Antony Porter, senior full-stack engineer in Austin: React, TypeScript, Next.js, Node, and AWS serverless, plus production LLM streaming and AI pipelines."
    />
    <link rel="canonical" href="https://antonyporter.com" />

    <meta property="og:site_name" content="Antony Porter" />
    <meta
      property="og:title"
      content="Antony Porter - Senior Full-Stack Software Engineer"
    />
    <meta
      property="og:description"
      content="I build product UIs in React, TypeScript, and Next.js, and the AWS serverless backends under them: streaming LLM APIs on Lambda, async image pipelines, SwiftUI on iOS."
    />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:url" content="https://antonyporter.com" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Antony Porter - Senior Full-Stack Software Engineer"
    />
    <meta
      name="twitter:description"
      content="I build product UIs in React, TypeScript, and Next.js, and the AWS serverless backends under them: streaming LLM APIs on Lambda, async image pipelines, SwiftUI on iOS."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Apple Touch Icon (for iOS home screen) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Antony Porter | Senior Full-Stack Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
